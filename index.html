<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>We All Have So Much in Common</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section id="home" class="view view-home" data-view="home">
        <nav class="home-nav" aria-label="Primary">
          <a class="home-link" href="/#/new">New Ticket</a>
          <a class="home-link" href="/#/community">View Community</a>
        </nav>
      </section>

      <section id="new" class="view view-new" data-view="new" hidden>
        <div class="page-top">
          <a class="back-link" href="/#/">Home</a>
          <button class="submit-link" type="submit" form="ticket-form">Add Ticket</button>
        </div>

        <form id="ticket-form" class="ticket-form" autocomplete="off">
          <article
            class="ticket ticket-editor"
            id="ticket-preview"
            style="--ombre-start: #e9ca30; --ombre-end: #e4451a"
          >
            <div class="ticket-face" aria-hidden="true"></div>
            <div class="ticket-stub">
              <div class="ticket-qr" id="editor-qr" aria-hidden="true">
                <div data-qr></div>
              </div>
              <label class="ticket-place">
                <span class="sr-only">Place</span>
                <input
                  id="place-stub"
                  name="place"
                  type="text"
                  maxlength="12"
                  placeholder="PLACE"
                  required
                  spellcheck="false"
                  autocapitalize="characters"
                />
              </label>
              <label class="ticket-meta-field">
                <span>Date</span>
                <div class="ticket-date-input" id="date-stub">
                  <input
                    data-date="mm"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    size="2"
                    placeholder="MM"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Month"
                  />
                  <span aria-hidden="true">/</span>
                  <input
                    data-date="dd"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    size="2"
                    placeholder="DD"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Day"
                  />
                  <span aria-hidden="true">/</span>
                  <input
                    data-date="year"
                    type="text"
                    inputmode="numeric"
                    maxlength="4"
                    size="4"
                    placeholder="YEAR"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Year"
                  />
                </div>
              </label>
              <label class="ticket-meta-field">
                <span>Passenger</span>
                <input
                  id="passenger-stub"
                  class="ticket-passenger-input"
                  name="passenger"
                  type="text"
                  maxlength="22"
                  placeholder=""
                  required
                  spellcheck="false"
                  autocapitalize="characters"
                />
              </label>
            </div>

            <div class="ticket-main">
              <div class="ticket-main-copy">
                <label class="ticket-place">
                  <span class="sr-only">Place</span>
                  <input
                    id="place-main"
                    type="text"
                    maxlength="12"
                    placeholder="PLACE"
                    spellcheck="false"
                    tabindex="-1"
                    autocapitalize="characters"
                  />
                </label>
                <label class="ticket-meta-field">
                  <span>Date</span>
                  <div class="ticket-date-input" id="date-main">
                    <input
                      data-date="mm"
                      type="text"
                      inputmode="numeric"
                      maxlength="2"
                      size="2"
                      placeholder="MM"
                      autocomplete="off"
                      spellcheck="false"
                      tabindex="-1"
                      aria-label="Month"
                    />
                    <span aria-hidden="true">/</span>
                    <input
                      data-date="dd"
                      type="text"
                      inputmode="numeric"
                      maxlength="2"
                      size="2"
                      placeholder="DD"
                      autocomplete="off"
                      spellcheck="false"
                      tabindex="-1"
                      aria-label="Day"
                    />
                    <span aria-hidden="true">/</span>
                    <input
                      data-date="year"
                      type="text"
                      inputmode="numeric"
                      maxlength="4"
                      size="4"
                      placeholder="YEAR"
                      autocomplete="off"
                      spellcheck="false"
                      tabindex="-1"
                      aria-label="Year"
                    />
                  </div>
                </label>
                <label class="ticket-meta-field">
                  <span>Passenger</span>
                  <input
                    id="passenger-main"
                    class="ticket-passenger-input"
                    type="text"
                    maxlength="22"
                    placeholder=""
                    spellcheck="false"
                    tabindex="-1"
                    autocapitalize="characters"
                  />
                </label>
              </div>
              <div class="ticket-write">
                <label class="ticket-write-field">
                  <span class="sr-only">Your memory</span>
                  <textarea
                    id="ticket-memory"
                    name="memory"
                    rows="8"
                    maxlength="480"
                    required
                    placeholder="Write your memory here"
                  ></textarea>
                </label>
              </div>
            </div>
          </article>

          <div class="ticket-tools">
            <div class="ticket-tools-start">
            <div class="cmyk-triggers">
              <fieldset class="cmyk-group" id="cmyk-start">
                <legend class="sr-only">From</legend>
                <button
                  type="button"
                  class="cmyk-circle"
                  data-trigger
                  aria-label="From color"
                  aria-expanded="false"
                ></button>
                <span class="cmyk-circle-label">From</span>
                <div class="cmyk-popover" data-popover>
                  <div class="cmyk-graph">
                    <div class="cmyk-sv-wrap">
                      <canvas data-sv width="260" height="168"></canvas>
                      <span class="cmyk-sv-cursor" data-sv-cursor></span>
                    </div>
                    <div class="cmyk-hue-wrap">
                      <canvas data-hue width="18" height="168"></canvas>
                      <span class="cmyk-hue-cursor" data-hue-cursor></span>
                    </div>
                  </div>
                  <p class="cmyk-readout" data-readout></p>
                </div>
              </fieldset>

              <fieldset class="cmyk-group" id="cmyk-end">
                <legend class="sr-only">To</legend>
                <button
                  type="button"
                  class="cmyk-circle"
                  data-trigger
                  aria-label="To color"
                  aria-expanded="false"
                ></button>
                <span class="cmyk-circle-label">To</span>
                <div class="cmyk-popover" data-popover>
                  <div class="cmyk-graph">
                    <div class="cmyk-sv-wrap">
                      <canvas data-sv width="260" height="168"></canvas>
                      <span class="cmyk-sv-cursor" data-sv-cursor></span>
                    </div>
                    <div class="cmyk-hue-wrap">
                      <canvas data-hue width="18" height="168"></canvas>
                      <span class="cmyk-hue-cursor" data-hue-cursor></span>
                    </div>
                  </div>
                  <p class="cmyk-readout" data-readout></p>
                </div>
              </fieldset>

              <fieldset class="cmyk-group" id="cmyk-type">
                <legend class="sr-only">Type</legend>
                <button
                  type="button"
                  class="cmyk-circle"
                  data-trigger
                  aria-label="Type color"
                  aria-expanded="false"
                  style="--swatch: #000000"
                ></button>
                <span class="cmyk-circle-label">Type</span>
                <div class="cmyk-popover" data-popover>
                  <div class="cmyk-graph">
                    <div class="cmyk-sv-wrap">
                      <canvas data-sv width="260" height="168"></canvas>
                      <span class="cmyk-sv-cursor" data-sv-cursor></span>
                    </div>
                    <div class="cmyk-hue-wrap">
                      <canvas data-hue width="18" height="168"></canvas>
                      <span class="cmyk-hue-cursor" data-hue-cursor></span>
                    </div>
                  </div>
                  <p class="cmyk-readout" data-readout></p>
                </div>
              </fieldset>
            </div>
            <a class="media-link" id="add-media" href="#/m/">Add Media</a>
            </div>
          </div>
        </form>
      </section>

      <section id="community" class="view view-community" data-view="community" hidden>
        <a class="back-link community-home" href="/#/">Home</a>
        <h1 class="community-title">Community</h1>
        <div class="community-stage">
          <button type="button" class="community-arrow" data-community-prev aria-label="Previous tickets">
            ‹
          </button>
          <div class="community-frame">
            <div id="ticket-grid" class="ticket-grid"></div>
          </div>
          <button type="button" class="community-arrow" data-community-next aria-label="Next tickets">
            ›
          </button>
        </div>
      </section>

      <section id="ticket-view" class="view view-ticket" data-view="ticket" hidden>
        <a class="back-link" href="#/community">Back</a>
        <div id="ticket-full" class="ticket-full"></div>
      </section>

      <section id="memory" class="view view-memory" data-view="memory" hidden>
        <div class="memory-top" data-edit-only>
          <a class="back-link" data-memory-back href="/#/new">Back</a>
          <button type="button" class="memory-save" data-memory-save>Save</button>
        </div>
        <header class="memory-header">
          <h1 data-memory-title>Memory</h1>
          <p class="memory-meta" data-memory-meta></p>
        </header>

        <p class="memory-note" data-edit-only>
          these extra media attachments on this page can be viewed when scanning the qr code on your ticket!
        </p>

        <nav class="memory-add" data-edit-only>
          <button type="button" data-add-text>add text</button>
          <button type="button" data-add-voice>add voice memo</button>
          <button type="button" data-add-file>add attachment</button>
          <input data-file-input type="file" hidden multiple />
        </nav>

        <p class="memory-status" data-memory-status hidden></p>
        <div class="memory-list" data-memory-list></div>
        <p class="memory-empty" data-memory-empty hidden>Nothing saved on this ticket yet.</p>
      </section>
    </main>

    <script src="/qrcode.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
